<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="pokeapi-kotlin: Kotlin client for PokeAPI with a Jetpack Compose Pokedex" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8F1426"/>
      <stop offset="1" stop-color="#C8243A"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FCF5F4"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CDE9BC"/><stop offset="1" stop-color="#EEF6E8"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F9D3B6"/><stop offset="1" stop-color="#FCEDE2"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9D8FA"/><stop offset="1" stop-color="#EAF0FD"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCF0B8"/><stop offset="1" stop-color="#FDF8E2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3A0610" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="1150" cy="60" r="200" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="40" cy="560" r="160" fill="#FFD166" opacity="0.07"/>

  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="160" fill="#FFD166" font-size="22" font-weight="700" letter-spacing="3">KOTLIN · POKEAPI V2</text>
    <text x="80" y="228" fill="#FFFFFF" font-size="58" font-weight="800">pokeapi-kotlin</text>
    <text x="80" y="280" fill="#FFE1E1" font-size="25">A typed coroutine client for PokeAPI with caching,</text>
    <text x="80" y="314" fill="#FFE1E1" font-size="25">evolution trees, type matchups and a Compose Pokédex.</text>
    <g font-size="16" font-weight="600">
      <rect x="80" y="360" width="112" height="40" rx="20" fill="#FFFFFF" opacity="0.15"/>
      <text x="136" y="385" fill="#FFFFFF" text-anchor="middle">Coroutines</text>
      <rect x="204" y="360" width="148" height="40" rx="20" fill="#FFFFFF" opacity="0.15"/>
      <text x="278" y="385" fill="#FFFFFF" text-anchor="middle">Memory + disk</text>
      <rect x="364" y="360" width="128" height="40" rx="20" fill="#FFFFFF" opacity="0.15"/>
      <text x="428" y="385" fill="#FFFFFF" text-anchor="middle">Paging Flow</text>
      <rect x="504" y="360" width="140" height="40" rx="20" fill="#FFFFFF" opacity="0.15"/>
      <text x="574" y="385" fill="#FFFFFF" text-anchor="middle">Type matchups</text>
      <rect x="80" y="412" width="148" height="40" rx="20" fill="#FFFFFF" opacity="0.15"/>
      <text x="154" y="437" fill="#FFFFFF" text-anchor="middle">Evolution trees</text>
      <rect x="240" y="412" width="160" height="40" rx="20" fill="#FFFFFF" opacity="0.15"/>
      <text x="320" y="437" fill="#FFFFFF" text-anchor="middle">Compose helpers</text>
    </g>
  </g>

  <!-- Pokédex grid card -->
  <g filter="url(#shadow)">
    <rect x="740" y="64" width="440" height="432" rx="32" fill="url(#phone)"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="772" y="118" fill="#201A1A" font-size="28" font-weight="800">Pokédex</text>
    <text x="1148" y="118" fill="#574343" font-size="14" text-anchor="end">151 entries</text>
    <rect x="772" y="134" width="376" height="38" rx="19" fill="none" stroke="#DFC9C8" stroke-width="2"/>
    <circle cx="796" cy="152" r="7" fill="none" stroke="#8C7473" stroke-width="2.5"/>
    <line x1="801" y1="157" x2="807" y2="163" stroke="#8C7473" stroke-width="2.5" stroke-linecap="round"/>
    <text x="816" y="158" fill="#8C7473" font-size="14">Search by name or number</text>

    <!-- Cell 1: grass -->
    <rect x="772" y="188" width="180" height="140" rx="20" fill="url(#g1)"/>
    <text x="786" y="210" fill="#201A1A" opacity="0.5" font-size="12" font-weight="700">#0001</text>
    <ellipse cx="862" cy="272" rx="34" ry="24" fill="#7AC74C" stroke="#3D6326" stroke-width="2.5"/>
    <polygon points="838,236 834,212 852,228" fill="#7AC74C" stroke="#3D6326" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="886,236 890,212 872,228" fill="#7AC74C" stroke="#3D6326" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="862" cy="240" r="20" fill="#7AC74C" stroke="#3D6326" stroke-width="2.5"/>
    <ellipse cx="855" cy="240" rx="3.5" ry="4.5" fill="#1F1A24"/><ellipse cx="869" cy="240" rx="3.5" ry="4.5" fill="#1F1A24"/>
    <rect x="786" y="304" width="58" height="16" rx="8" fill="#7AC74C"/><text x="815" y="316" fill="#1D1B20" font-size="10" font-weight="700" text-anchor="middle">Grass</text>
    <rect x="848" y="304" width="58" height="16" rx="8" fill="#A33EA1"/><text x="877" y="316" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">Poison</text>

    <!-- Cell 2: fire -->
    <rect x="968" y="188" width="180" height="140" rx="20" fill="url(#g2)"/>
    <text x="982" y="210" fill="#201A1A" opacity="0.5" font-size="12" font-weight="700">#0004</text>
    <path d="M1100 228 C1112 244 1112 262 1096 268" fill="none" stroke="#77401A" stroke-width="7" stroke-linecap="round"/>
    <path d="M1100 206 C1108 216 1110 226 1102 232 C1094 234 1090 224 1094 218 Z" fill="#FFD166" stroke="#77401A" stroke-width="2"/>
    <ellipse cx="1058" cy="274" rx="30" ry="22" fill="#EE8130" stroke="#77401A" stroke-width="2.5"/>
    <circle cx="1056" cy="242" r="20" fill="#EE8130" stroke="#77401A" stroke-width="2.5"/>
    <ellipse cx="1049" cy="242" rx="3.5" ry="4.5" fill="#1F1A24"/><ellipse cx="1063" cy="242" rx="3.5" ry="4.5" fill="#1F1A24"/>
    <rect x="982" y="304" width="50" height="16" rx="8" fill="#EE8130"/><text x="1007" y="316" fill="#1D1B20" font-size="10" font-weight="700" text-anchor="middle">Fire</text>

    <!-- Cell 3: water -->
    <rect x="772" y="340" width="180" height="140" rx="20" fill="url(#g3)"/>
    <text x="786" y="362" fill="#201A1A" opacity="0.5" font-size="12" font-weight="700">#0007</text>
    <circle cx="840" cy="390" r="8" fill="#6390F0" stroke="#32487A" stroke-width="2.5"/><circle cx="884" cy="390" r="8" fill="#6390F0" stroke="#32487A" stroke-width="2.5"/>
    <ellipse cx="862" cy="428" rx="36" ry="22" fill="#6390F0" stroke="#32487A" stroke-width="2.5"/>
    <circle cx="862" cy="398" r="19" fill="#6390F0" stroke="#32487A" stroke-width="2.5"/>
    <ellipse cx="855" cy="398" rx="3.5" ry="4.5" fill="#1F1A24"/><ellipse cx="869" cy="398" rx="3.5" ry="4.5" fill="#1F1A24"/>
    <rect x="786" y="456" width="56" height="16" rx="8" fill="#6390F0"/><text x="814" y="468" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">Water</text>

    <!-- Cell 4: stats -->
    <rect x="968" y="340" width="180" height="140" rx="20" fill="url(#g4)"/>
    <text x="982" y="364" fill="#201A1A" font-size="13" font-weight="700">Base stats</text>
    <g font-size="10" fill="#574343">
      <text x="982" y="388">HP</text><rect x="1010" y="381" width="124" height="7" rx="3.5" fill="#F2E6E5"/><rect x="1010" y="381" width="38" height="7" rx="3.5" fill="#FF8A3D"/>
      <text x="982" y="406">Atk</text><rect x="1010" y="399" width="124" height="7" rx="3.5" fill="#F2E6E5"/><rect x="1010" y="399" width="41" height="7" rx="3.5" fill="#F5C944"/>
      <text x="982" y="424">Def</text><rect x="1010" y="417" width="124" height="7" rx="3.5" fill="#F2E6E5"/><rect x="1010" y="417" width="38" height="7" rx="3.5" fill="#F5C944"/>
      <text x="982" y="442">SpA</text><rect x="1010" y="435" width="124" height="7" rx="3.5" fill="#F2E6E5"/><rect x="1010" y="435" width="53" height="7" rx="3.5" fill="#9BD045"/>
      <text x="982" y="460">Spe</text><rect x="1010" y="453" width="124" height="7" rx="3.5" fill="#F2E6E5"/><rect x="1010" y="453" width="49" height="7" rx="3.5" fill="#3CC46A"/>
    </g>
  </g>
</svg>
